name: Experimento

# Las rejillas son espera contra una API, no CPU: el portatil no aporta nada y se
# satura. Aqui corren desatendidas, con los checkpoints por episodio guardados en una
# rama aparte, asi que un lanzamiento que agote el tiempo continua en el siguiente sin
# re-pagar lo ya medido.
#
# workflow_dispatch Y NADA MAS. El repo es publico: cualquier disparador que un fork
# pueda provocar expondria GEMINI_API_KEY.

on:
  workflow_dispatch:
    inputs:
      experimento:
        description: Que rejilla correr
        required: true
        type: choice
        options: [table1, probeA, probeC]
      model:
        description: ID de modelo (gemini-* enruta solo a Gemini)
        required: true
        default: gemini-3-flash-preview
        type: string
      horizons:
        description: 'table1: horizontes separados por espacios, de menor a mayor'
        default: '10 25 50'
        type: string
      seeds:
        description: 'table1/probeA: numero de seeds. probeC: lista, p.ej. "4 10 6"'
        default: '5'
        type: string
      repeats:
        description: Repeticiones por seed (1 basta en greedy)
        default: '1'
        type: string
      runtimes:
        description: Runtimes a correr, vacio = los cuatro
        default: ''
        type: string
      max_tokens:
        description: Tope de salida por llamada
        default: '600'
        type: string
      extra:
        description: Argumentos extra para el corredor (--ks, --oracle-schema, --k...)
        default: ''
        type: string
      provider:
        description: >-
          Proveedor de inferencia. `auto` usa la ruta de AI Studio con GEMINI_API_KEY,
          que es la unica operativa hoy. `vertex` autentica con Workload Identity
          Federation y NO funciona hasta que alguien con permisos de IAM haga el alta
          descrita en docs/wif-actions.md: sin ella, el job falla en el paso de
          autenticacion. Las rejillas largas se corren en local con `gcloud auth
          login`, renovando la sesion cuando caduca.
        default: auto
        type: choice
        options: [vertex, auto, api, foundry, gemini]

permissions:
  contents: write
  # WIF funciona intercambiando el token OIDC que GitHub emite para este job por
  # credenciales de GCP de vida corta. Sin `id-token: write` no hay token que cambiar.
  id-token: write

concurrency:
  # Dos lanzamientos de la misma celda se pisarian el checkpoint. Se encolan, no se
  # cancelan: cancelar tira episodios ya pagados.
  group: experimento-${{ inputs.experimento }}-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # por debajo del tope de 6 h del runner

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_VERTEX_PROJECT: ${{ vars.GCP_PROJECT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RAMA: runs/${{ inputs.experimento }}-${{ inputs.model }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # La sesion SSO de gcloud en un portatil caduca cada pocas horas y se llevo por
      # delante tres tandas. WIF no caduca a media rejilla: la credencial se emite
      # para este job y muere con el. Y no hay ninguna clave en ningun sitio: el
      # secreto es la identidad del repositorio, que GitHub firma.
      - name: Autenticar contra GCP (Workload Identity Federation)
        if: inputs.provider == 'vertex'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # El cliente pide el token con `gcloud auth print-access-token`, asi que gcloud
      # tiene que estar en el PATH y ver las credenciales que acaba de dejar el paso
      # anterior.
      - name: Instalar gcloud
        if: inputs.provider == 'vertex'
        uses: google-github-actions/setup-gcloud@v2

      - name: Comprobar que la clave tiene valor
        # Un secreto creado sin valor -- `gh secret set` leyendo de un stdin vacio --
        # existe, se lista y llega aqui como cadena vacia. Sin esta comprobacion el
        # sintoma es un traceback en el primer episodio, dos minutos de runner mas
        # tarde, y se lee como un fallo del corredor.
        env:
          MODEL: ${{ inputs.model }}
        run: |
          if [ "${{ inputs.provider }}" = "vertex" ]; then
            echo "proveedor vertex: sin claves, credencial de vida corta via WIF"
            gcloud auth print-access-token >/dev/null \
              && echo "credencial de GCP operativa" \
              || { echo "::error::WIF no ha dejado credencial utilizable"; exit 1; }
            exit 0
          fi
          if [ "${MODEL#gemini}" != "$MODEL" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY esta vacia. Ponla con:  gh secret set GEMINI_API_KEY --repo JaviMaligno/delayed-relevance --body '<clave>'"
            exit 1
          fi
          if [ "${MODEL#claude}" != "$MODEL" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY esta vacia."
            exit 1
          fi
          echo "clave presente (${#GEMINI_API_KEY} caracteres para Gemini)"

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Restaurar checkpoints de la rama de resultados
        run: |
          git fetch origin "$RAMA" || echo "sin rama previa: primera corrida"
          if git rev-parse --verify "origin/$RAMA" >/dev/null 2>&1; then
            git checkout "origin/$RAMA" -- results/ || true
            echo "checkpoints restaurados:"
            ls -1 results/partial_* 2>/dev/null || echo "  ninguno"
          fi

      - name: Correr
        # Las entradas entran por `env`, no interpoladas en el shell: asi no hay
        # comillas que se rompan ni una entrada que se lea como comando.
        env:
          EXPERIMENTO: ${{ inputs.experimento }}
          MODEL: ${{ inputs.model }}
          HORIZONS: ${{ inputs.horizons }}
          SEEDS: ${{ inputs.seeds }}
          REPEATS: ${{ inputs.repeats }}
          RUNTIMES: ${{ inputs.runtimes }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          PROVIDER: ${{ inputs.provider }}
          EXTRA: ${{ inputs.extra }}
        run: |
          set -euo pipefail
          ONLY=""
          if [ -n "$RUNTIMES" ]; then ONLY="--only $RUNTIMES"; fi
          PROV="--provider $PROVIDER"
          case "$EXPERIMENTO" in
            table1)
              # De menor a mayor: si el criterio de R1 queda decidido en un horizonte
              # corto, el largo no hace falta.
              for T in $HORIZONS; do
                echo "::group::table1 T=$T"
                python experiments/replicate_table1.py $PROV --horizon "$T" --seeds "$SEEDS" --repeats "$REPEATS" --model "$MODEL" --max-tokens "$MAX_TOKENS" $ONLY $EXTRA
                echo "::endgroup::"
              done
              ;;
            probeA)
              python experiments/probe_a.py $PROV --seeds "$SEEDS" --repeats "$REPEATS" --model "$MODEL" --max-tokens "$MAX_TOKENS" $ONLY $EXTRA
              ;;
            probeC)
              python experiments/diagnose_probeC.py $PROV --seeds $SEEDS --repeats "$REPEATS" --model "$MODEL" --max-tokens "$MAX_TOKENS" $EXTRA
              ;;
          esac

      - name: Guardar resultados
        # `always()`: una rejilla que se corta por tiempo o por un error de API ha
        # pagado episodios que hay que conservar igual.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RAMA"
          git add -f results/
          git commit -m "runs: ${{ inputs.experimento }} ${{ inputs.model }} (run ${{ github.run_number }})" \
            || { echo "nada nuevo que guardar"; exit 0; }
          git push -f origin "$RAMA"

      - name: Subir tambien como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.experimento }}-${{ inputs.model }}-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
